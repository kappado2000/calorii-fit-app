name: iOS unsigned build (for Sideloadly)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        # --build-number must change on every install or Sideloadly/iOS treats
        # the IPA as "already installed" and skips replacing the binary on
        # the device — pubspec.yaml's own build number (1.1.0+2) never
        # changes between manual edits, so the workflow's own run number is
        # used instead to guarantee every dispatch produces a genuinely new,
        # installable version.
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CalorieApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CalorieApp-unsigned-ipa
          path: CalorieApp-unsigned.ipa
          retention-days: 14
